name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bunx biome format src test package.json tsconfig.json tsconfig.lib.json biome.json
      - run: bun run build
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun test
